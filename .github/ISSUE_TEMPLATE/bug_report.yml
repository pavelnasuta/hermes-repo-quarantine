name: Bug report
description: Report a reproducible problem without sensitive information.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private keys, production URLs, private repository content, or malware payloads.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction
      description: Provide a synthetic or public reproduction only.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Hermes version, OS, and isolation posture. Do not include private paths or secrets.
